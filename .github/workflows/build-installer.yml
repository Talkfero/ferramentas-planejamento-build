name: Build installer

# SO' roda quando alguem pede (workflow_dispatch). O gatilho `push` na main
# saiu de proposito (31/07/2026, decisao do usuario): mexer no spec, num
# script ou no .iss disparava um build de ~30min e REPUBLICAVA a release
# `latest`, apagando a anterior. Efeitos ruins na pratica:
#
#   - um merge de refatoracao/documentacao substituia o instalador que
#     acabara de ser publicado e validado;
#   - mergear duas PRs seguidas gerava dois builds concorrentes disputando a
#     mesma tag `latest`;
#   - publicar na rede virava corrida contra o proximo merge.
#
# Publicar passa a ser ato deliberado. Para gerar: aba Actions -> "Build
# installer" -> Run workflow (ou `gh workflow run "Build installer"`).
on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Instalador a gerar: all ou uma chave unica (launcher,elexplan,unif,coplan_web,cadastro). Capex fundido no coplan_web; Status de Medicao fundido no elexplan; ImageDx aposentado (detalhamento no coplan_web); Diagnostico aposentado (modulo do coplan_web)."
        required: false
        default: "all"
      rebuild_only:
        description: "Apps que entram nesta versao (ex.: coplan_web). Os demais ficam como na ultima publicacao (release base-*): mesmo commit e, se as dependencias nao mudaram, o mesmo .exe. Vazio = recompila tudo do main."
        required: false
        default: ""
      base:
        description: "Tag da base publicada a reaproveitar (ex.: base-1.3.11). Vazio = a mais recente. So' vale com rebuild_only."
        required: false
        default: ""
      completo:
        description: "Com rebuild_only: recompilar TODOS mesmo com dependencias iguais (os nao escolhidos seguem no commit publicado). Plano B se o incremental falhar."
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: write

env:
  BUNDLE_DIR: dist/FerramentasCompartilhadas
  BUNDLE_BASE_DIR: bundle_base
  # Fixa onde o pip guarda os wheels baixados. O default depende do perfil do
  # runner; apontando para o workspace, o cache abaixo tem caminho
  # deterministico. build_all_shared.bat chama `python -m pip` e herda isto.
  PIP_CACHE_DIR: ${{ github.workspace }}/.pipcache

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # prepare_apps.ps1 clona TODOS os repos de app, independente do que sera
      # compilado. E' de proposito: a chave do cache abaixo hasheia os
      # requirements dos apps, entao eles precisam existir aqui.
      - name: Prepare app sources
        shell: pwsh
        env:
          BUILD_REPO_READ_TOKEN: ${{ secrets.BUILD_REPO_READ_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\prepare_apps.ps1

      # O runner comeca limpo a cada execucao, entao sem isto o pip rebaixa
      # tudo toda vez. Medido no run 30637305478: 4min19s dos ~31min do build
      # (~14%). Nao e' o gargalo -- so' o PyInstaller leva 20min -- mas e'
      # barato de recuperar.
      #
      # `restore-keys` com prefixo e' de proposito: o cache do pip e' ADITIVO,
      # entao serve mesmo quando um requirements mudou (restaura o mais recente
      # e o pip baixa so' o que faltar). Diferente da base do bundle, que exige
      # dependencias identicas -- ali um arquivo velho corromperia o resultado.
      #
      # Precisa vir DEPOIS do prepare_apps: a chave hasheia os requirements dos
      # apps, que so' existem depois do clone.
      - name: Cache dos downloads do pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-py312-${{ hashFiles('requirements.lock.txt', 'apps/**/requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py312-

      # =================================================================
      # Modo de build -- base publicada (WS-20261118-base-publicada)
      #
      # rebuild_only VAZIO -> FULL: o PyInstaller monta o bundle inteiro,
      #   cada app no `main`. Vale MESMO com apps=<uma chave>. O instalador
      #   parcial precisa de um _internal COMPLETO porque o [InstallDelete]
      #   do Setup_turbinado.iss apaga {app}\_internal antes de instalar.
      #
      # rebuild_only PREENCHIDO (ex.: coplan_web) -> so' esses apps saem do
      #   `main`. Os outros voltam ao commit da ULTIMA PUBLICACAO, registrado
      #   na release fixa `base-<versao>` (ou na do input `base`), e nunca ao
      #   `main` -- que pode ter trabalho pela metade.
      #   - Dependencias iguais as da base -> INCREMENTAL: o .exe dos outros
      #     vem do bundle publicado, byte a byte (o manifesto confere).
      #   - Dependencias mudaram -> FULL, mas os nao escolhidos ainda saem do
      #     commit publicado. O _internal compartilhado exige isso.
      #
      # Ate 18/11/2026 a base era o actions/cache do ultimo build FULL: expira
      # com 7 dias sem uso (o incremental caia sozinho para full, pegando o
      # `main` de todos) e podia ser um build de teste, nao o publicado.
      # =================================================================
      - name: Decidir modo de build (base publicada)
        id: final_mode
        shell: pwsh
        env:
          REBUILD_ONLY: ${{ github.event.inputs.rebuild_only }}
          BASE_TAG: ${{ github.event.inputs.base }}
          FORCAR_COMPLETO: ${{ github.event.inputs.completo }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $rebuild = "$env:REBUILD_ONLY".Trim().ToLowerInvariant()
          if ($rebuild -eq "all") { $rebuild = "" }
          $mode = "full"; $apps = "all"; $escolhidos = ""; $tag = ""

          if ($rebuild) {
            $escolhidos = (python .\scripts\bundle_manifest.py normalizar "$rebuild" | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $escolhidos) { throw "rebuild_only invalido: $rebuild" }
            $tag = "$env:BASE_TAG".Trim()
            if (-not $tag) {
              $tag = (python .\scripts\bundle_manifest.py ultima-base --repo "$env:GITHUB_REPOSITORY" | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw "Falha ao listar as releases base-*." }
            }
            if (-not $tag) {
              throw ("Nenhuma base publicada (release base-*). Rode com rebuild_only vazio; " +
                     "a Parte 3 do docs/PUBLICAR.md registra a base depois de publicar.")
            }
            Write-Host "[base] $tag"
            gh release download $tag --repo "$env:GITHUB_REPOSITORY" -p manifest.json -D base_dl --clobber
            if ($LASTEXITCODE -ne 0) { throw "Falha ao baixar o manifest.json da $tag." }
            python .\scripts\bundle_manifest.py fixar --base-manifest base_dl\manifest.json --escolhidos "$escolhidos" --root .
            if ($LASTEXITCODE -ne 0) { throw "Falha ao fixar os apps nao escolhidos no commit da $tag." }
          }

          # Depois do `fixar`: os requirements dos nao escolhidos ja sao os da base.
          $deps = (python .\scripts\bundle_manifest.py deps-hash --root . | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $deps) { throw "Falha ao calcular o codigo das dependencias." }
          Write-Host "[deps] $deps"

          if ($rebuild) {
            $base = Get-Content base_dl\manifest.json -Raw | ConvertFrom-Json
            if ("$env:FORCAR_COMPLETO" -eq "true") {
              Write-Host "[modo] completo=true: recompilando TODOS; os apps fora de rebuild_only seguem no commit publicado."
            } elseif ($base.deps_hash -eq $deps) {
              $mode = "incremental"; $apps = $escolhidos
            } else {
              Write-Host ("::warning::As dependencias mudaram desde a $tag (requirements, lock, spec ou hooks). " +
                          "Recompilando TODOS; os apps fora de rebuild_only seguem no commit publicado, nao no main.")
            }
          }

          Write-Host "[modo] $mode  |  APPS_TO_BUILD=$apps  |  escolhidos=$escolhidos  |  base=$tag  |  instalador=${{ github.event.inputs.apps || 'all' }}"
          "mode=$mode"             | Out-File $env:GITHUB_OUTPUT -Append
          "apps_to_build=$apps"    | Out-File $env:GITHUB_OUTPUT -Append
          "escolhidos=$escolhidos" | Out-File $env:GITHUB_OUTPUT -Append
          "base_tag=$tag"          | Out-File $env:GITHUB_OUTPUT -Append
          "deps_hash=$deps"        | Out-File $env:GITHUB_OUTPUT -Append

      # O zip e' o FerramentasCompartilhadas-portable.zip do build publicado.
      # tar do System32 (bsdtar) le zip e e' bem mais rapido que Expand-Archive.
      - name: Baixar o bundle da base
        if: steps.final_mode.outputs.base_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.final_mode.outputs.base_tag }}"
          gh release download $tag --repo "$env:GITHUB_REPOSITORY" -p bundle.zip -D base_dl --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao baixar o bundle.zip da $tag." }
          New-Item -ItemType Directory -Force -Path "${{ env.BUNDLE_BASE_DIR }}" | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf base_dl\bundle.zip -C "${{ env.BUNDLE_BASE_DIR }}"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao extrair o bundle da $tag." }
          if (-not (Test-Path "${{ env.BUNDLE_BASE_DIR }}\_internal\base_library.zip")) {
            throw "bundle.zip da $tag nao tem _internal\base_library.zip."
          }
          Remove-Item base_dl\bundle.zip -Force
          $n = @(Get-ChildItem "${{ env.BUNDLE_BASE_DIR }}" -Recurse -File -Force).Count
          Write-Host "[bundle base] $tag extraido: $n arquivo(s)"

      - name: Validar layout dos apps a compilar
        shell: pwsh
        run: |
          python .\scripts\validate_layout.py --apps "${{ steps.final_mode.outputs.apps_to_build }}"

      # Os .exe do PyInstaller saiam SEM metadado de versao (FileVersion,
      # ProductName e CompanyName vazios). Binario anonimo, sem assinatura e
      # que lanca outros processos e' o perfil que a heuristica do Defender
      # marca -- foi o que bloqueou o launcher no 1.2.1 (erro 225). O spec
      # preenche o VSVersionInfo a partir daqui; a versao sai do proprio
      # Setup_turbinado.iss para nao existir uma segunda fonte de verdade.
      - name: Resolver a versao da suite (do .iss)
        id: suite_version
        shell: pwsh
        run: |
          $m = Select-String -Path .\Setup_turbinado.iss `
                 -Pattern '^\s*#define\s+AppVersion\s+"([^"]+)"' |
               Select-Object -First 1
          if (-not $m) { throw "AppVersion nao encontrada em Setup_turbinado.iss" }
          $v = $m.Matches[0].Groups[1].Value
          Write-Host "[versao] APP_VERSION=$v"
          "value=$v" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Build shared PyInstaller bundle
        shell: cmd
        env:
          APPS_TO_BUILD: ${{ steps.final_mode.outputs.apps_to_build }}
          APP_VERSION: ${{ steps.suite_version.outputs.value }}
          # No incremental o pip so' instala os requirements dos apps
          # recompilados; pacote faltando tem de derrubar o build, nao virar
          # aviso no log. Ver o cabecalho de STRICT_COLLECT em multi_apps.spec.
          STRICT_COLLECT: ${{ steps.final_mode.outputs.mode == 'incremental' && '1' || '' }}
          # Trava de versoes: todo `pip install` do build_all_shared.bat respeita
          # o lock, como no build_all_local.ps1. Ate 15/10/2026 o workflow nao
          # tinha isto e o bundle saiu com numpy, onnxruntime, playwright e
          # snowflake-connector mais novos que os validados. O caminho do
          # runner nao tem espacos, entao o lock e' usado no lugar.
          PIP_CONSTRAINT: ${{ github.workspace }}\requirements.lock.txt
        run: |
          call build_all_shared.bat %APPS_TO_BUILD%

      # Trava contra o defeito do Coplan 1.7.0 (19/11/2026): o build incremental
      # so' instalou os requirements do Coplan, o .exe dele saiu com 293 modulos
      # a menos que o da base e o pandas quebrou no app. Compara o PYZ de cada
      # .exe recompilado com o da base e reprova se faltar biblioteca de
      # terceiros ou da biblioteca padrao. Roda ANTES do overlay.
      - name: Conferir modulos dos .exe recompilados contra a base
        if: steps.final_mode.outputs.base_tag != ''
        shell: pwsh
        run: |
          python .\scripts\bundle_manifest.py conferir-modulos --bundle "${{ env.BUNDLE_DIR }}" --base "${{ env.BUNDLE_BASE_DIR }}" --apps "${{ steps.final_mode.outputs.apps_to_build }}" --root .
          if ($LASTEXITCODE -ne 0) { throw "Algum .exe perdeu modulos em relacao a base publicada." }

      # O recem-compilado vence; da base vem so' o que falta (os .exe e as
      # libs dos apps nao escolhidos). Arquivo que o app escolhido deixou de
      # ter continua vindo da base ate o proximo build completo: os dados de
      # apps diferentes dividem pastas do _internal, entao nao da para limpar
      # "as pastas do app" com seguranca. Sem efeito enquanto nada listar a pasta.
      - name: Completar o bundle com o da base publicada
        if: steps.final_mode.outputs.mode == 'incremental'
        shell: pwsh
        run: |
          .\scripts\overlay_bundle.ps1 -Base "${{ env.BUNDLE_BASE_DIR }}" -Fresh "${{ env.BUNDLE_DIR }}"
          Remove-Item "${{ env.BUNDLE_BASE_DIR }}" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Limpar o bundle da base
        if: steps.final_mode.outputs.base_tag != ''
        shell: pwsh
        run: |
          Remove-Item "${{ env.BUNDLE_BASE_DIR }}" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Finalize bundle runtime configs
        shell: pwsh
        run: |
          .\scripts\finalize_bundle.ps1

      # Sempre "all": nos dois modos o bundle sai completo, e este passo roda o
      # self-test do Coplan (COPLAN_SELFTEST) -- e' o que pega um .exe com o
      # grafo de modulos furado ANTES de publicar.
      - name: Validate pywebview runtime bundle
        shell: pwsh
        run: |
          .\scripts\validate_runtime_bundle.ps1 -Apps all

      # Confere o que FOI empacotado contra o lock (os self-tests so' importam
      # Coplan e Elexplan e passaram com o bundle fora do lock em 15/10/2026).
      - name: Conferir bibliotecas do bundle contra o lock
        shell: pwsh
        run: |
          python scripts\check_bundle_lock.py "${{ env.BUNDLE_DIR }}"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build per-user installer
        shell: pwsh
        env:
          INSTALLER_APP: ${{ github.event.inputs.apps }}
        run: |
          $apps = ($env:INSTALLER_APP ?? "all").Trim().ToLower()
          if (-not $apps) { $apps = "all" }
          $args = @(".\Setup_turbinado.iss")
          if ($apps -and $apps -ne "all") {
            if ($apps.Contains(",") -or $apps.Contains(";")) {
              throw "Setup_turbinado.iss suporta instalador parcial de apenas um app por vez. Use apps=all ou uma unica chave."
            }
            $args = @("/DAPP_ONLY=$apps", ".\Setup_turbinado.iss")
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @args

      - name: Package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem -Path Output\*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "Instalador .exe nao encontrado em Output\" }
          Copy-Item $installer.FullName -Destination release\ -Force
          Write-Host "Instalador: $($installer.Name)"

          # Manifesto: o que o registrar-base.yml promove a base depois da
          # publicacao. No incremental ele REPROVA se um .exe reaproveitado
          # nao saiu identico ao da base.
          $margs = @(".\scripts\bundle_manifest.py", "gerar",
                     "--bundle", "${{ env.BUNDLE_DIR }}", "--root", ".",
                     "--versao", "${{ steps.suite_version.outputs.value }}",
                     "--modo", "${{ steps.final_mode.outputs.mode }}",
                     "--deps-hash", "${{ steps.final_mode.outputs.deps_hash }}",
                     "--instalador", $installer.FullName,
                     "--build-sha", "${{ github.sha }}", "--run-id", "${{ github.run_id }}",
                     "--saida", "release\manifest.json")
          $baseTag = "${{ steps.final_mode.outputs.base_tag }}"
          if ($baseTag) {
            $margs += @("--escolhidos", "${{ steps.final_mode.outputs.escolhidos }}",
                        "--base-manifest", "base_dl\manifest.json", "--base-tag", $baseTag)
          }
          python @margs
          if ($LASTEXITCODE -ne 0) { throw "Manifesto do bundle reprovado." }

          # O zip e' tambem o bundle que vira base-<versao> depois da publicacao.
          Compress-Archive -Path dist\FerramentasCompartilhadas\* -DestinationPath release\FerramentasCompartilhadas-portable.zip -Force

      - name: Publish rolling release (replaces previous)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: latest
          INSTALLER_APP: ${{ github.event.inputs.apps || 'all' }}
          BUNDLE_APPS: ${{ steps.final_mode.outputs.apps_to_build }}
          BUILD_MODE: ${{ steps.final_mode.outputs.mode }}
          BASE_TAG: ${{ steps.final_mode.outputs.base_tag }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          # Apaga as releases antigas para manter so' a mais nova -- MENOS as
          # base-*, que sao o registro permanente do que foi publicado.
          $old = gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName | ConvertFrom-Json
          foreach ($r in $old) {
            if ($r.tagName -like "base-*") { continue }
            Write-Host "Removendo release antiga: $($r.tagName)"
            gh release delete $r.tagName --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }
          $assets = Get-ChildItem release\* | ForEach-Object { $_.FullName }
          $base = if ($env:BASE_TAG) { $env:BASE_TAG } else { "nenhuma" }
          $notes = "Build automatico do instalador. Instalador: $($env:INSTALLER_APP). Modo: $($env:BUILD_MODE) (recompilado: $($env:BUNDLE_APPS); base: $base). Commit: $($env:COMMIT_SHA). Run: $($env:RUN_ID)."
          $ghArgs = @('release','create',$env:RELEASE_TAG) + $assets + @('--repo',$env:GITHUB_REPOSITORY,'--target',$env:COMMIT_SHA,'--title','Ferramentas de Planejamento - ultimo build','--notes',$notes,'--latest')
          gh @ghArgs
          Write-Host "Release publicada: https://github.com/$($env:GITHUB_REPOSITORY)/releases/tag/$($env:RELEASE_TAG)"

      - name: Cleanup old workflow artifacts
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ids = gh api --paginate "repos/$($env:GITHUB_REPOSITORY)/actions/artifacts" --jq ".artifacts[].id"
          foreach ($id in $ids) {
            if ("$id".Trim()) {
              Write-Host "Apagando artifact $id"
              gh api -X DELETE "repos/$($env:GITHUB_REPOSITORY)/actions/artifacts/$id" 2>$null
            }
          }
